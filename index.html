<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Invoicer</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#16213a;--mut:#667089;--line:#dde2ea;--acc:#c77700;--accbg:#fff4e0;--ok:#16794a;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1523;--panel:#18203a;--ink:#e7ebf5;--mut:#98a2bd;--line:#2a3558;--acc:#f0a53a;--accbg:#3a2c12;--ok:#4cc38a;--bad:#ff7b6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1523;--panel:#18203a;--ink:#e7ebf5;--mut:#98a2bd;--line:#2a3558;--acc:#f0a53a;--accbg:#3a2c12;--ok:#4cc38a;--bad:#ff7b6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.nav{background:var(--ink);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;align-self:start}
.nav h1{font-size:16px;margin:0 8px 18px;line-height:1.2}.nav h1 small{display:block;font-weight:400;opacity:.65;font-size:12px;margin-top:2px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfd6e6;padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer;margin-bottom:2px}
.nav button.on{background:#ffffff1f;color:#fff;font-weight:600}.nav button:hover{background:#ffffff14}
main{padding:22px;min-width:0}
h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 8px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.stat b{display:block;font-size:19px;margin-top:2px}.stat span{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
button.b,label.b{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
button.b.acc{background:var(--acc);color:#fff}button.b.g{background:none;color:var(--ink);border:1px solid var(--line)}button.b.sm{padding:4px 9px;font-size:12px}button.b.del{background:none;color:var(--bad);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:62px;resize:vertical}
.tw{overflow-x:auto}table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right}.pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accbg);color:var(--acc)}.pill.ok{background:#16794a22;color:var(--ok)}
.empty{color:var(--mut);padding:22px;text-align:center}
.ed{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;align-items:start}
.line{border:1px dashed var(--line);border-radius:6px;padding:10px;margin-bottom:8px}
.logo{max-height:70px;max-width:200px;display:block;margin:8px 0;background:#fff;padding:4px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;display:none;z-index:9}
.sheet{background:#fff;color:#111;border:1px solid #ccd;padding:28px;font:13px/1.45 Arial,Helvetica,sans-serif;max-width:800px;box-shadow:0 2px 10px #0002}
.sheet h4{margin:0;font-size:20px}.sheet .hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
.sheet .hd img{max-height:64px;max-width:170px;margin-bottom:6px;display:block}
.sheet table{width:100%;border-collapse:collapse;margin:12px 0}.sheet th,.sheet td{border:1px solid #444;padding:6px 8px;text-align:left;vertical-align:top}.sheet th{background:#eee}.sheet .n{text-align:right;white-space:nowrap}
.sheet .tot{margin-left:auto;width:300px}.sheet .tot td{border:0;border-bottom:1px solid #ccc}.sheet .tot tr:last-child td{border-top:2px solid #111;font-weight:700}
.pill.bad{background:#b4231822;color:var(--bad)}.nav select{margin:0 0 14px;background:#ffffff1f;color:#fff;border-color:#ffffff33}.nav option{color:#000}.nav #cos{width:100%}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.two .card{margin:0}
.sheet{display:flex;flex-direction:column;justify-content:space-between;min-height:1000px}.sheet .ft{margin-top:24px;padding-top:8px;border-top:1px solid #444;text-align:center;font-size:11px;white-space:pre-line;color:#222}.sheet .sg img{max-height:70px;max-width:220px;display:block;margin:6px 0 0 auto}.unsaved{color:var(--bad);font-size:12px;margin-left:8px;display:none}.unsaved.on{display:inline}
@media (max-width:820px){.sheet{min-height:0}.app{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;gap:4px;flex-wrap:wrap;padding:10px}.nav h1{width:100%;margin:0 4px 6px}.nav button{width:auto}.ed{grid-template-columns:1fr}main{padding:12px}.sheet{padding:14px}}
@media print{@page{margin:10mm}body{background:#fff}.nav,.form,.bar,#toast{display:none!important}.app,.ed{display:block}main{padding:0}.sheet{border:0;box-shadow:none;max-width:none;padding:0;min-height:272mm}}
</style>
</head>
<body>
<div class="app">
 <nav class="nav"><h1>HR Invoicer<small>Billing admin</small></h1><div id="cos"></div>
  <button data-v="dash">Dashboard</button><button data-v="inv">Invoices</button><button data-v="new">New invoice</button><button data-v="adm">Admin panel</button></nav>
 <main id="main"></main>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='sparklers_invoicer_v1';
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={co:{name:'Sparklers The Global HR Solutions',addr:'B-177, Aakriti Garden, Nehru Nagar,\nBhopal (M.P) - 462003',gstin:'23AGNPC9010B1Z2',logo:'',bank:'',terms:''},
clients:[{id:'c1',name:'Rivet Communications',addr:'551, Golf Course Rd, DLF Phase 5, Sector 43, Gurugram, Haryana 122003',gstin:'07AAICR2999A1Z7',pct:'8.33'},
{id:'c2',name:'NITESH INFRASTRUCTURE AND CONSTRUCTIONS',addr:'2nd Floor, No.25A, Imperial Court, Cunningham Road, Bengaluru, Karnataka 560052',gstin:'29AADFN2384F1Z7',pct:'8.33'}],
services:[{sac:'998513',name:'Contract Staffing services'},{sac:'998512',name:'Permanent placement services, other than executive search services'},{sac:'998515',name:'Long term staffing (payrolling) services'}],invoices:[]};
try{const s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(x){}
const ser=()=>JSON.stringify(D,(k,v)=>k==='co'?undefined:v);
const svOf=v=>D.services.find(x=>x.id===v.sv)||D.services.find(x=>x.sac===v.sac)||{};
function mig(){
 if(!D.svv){D.svv=1;[['998319','HRMS software provider (SaaS / subscription)'],['998519','HR shared services provider'],['998223','Payroll and compliance services provider'],['998519','HR service provider']].forEach(([a,b])=>D.services.push({sac:a,name:b}))}
 D.services.forEach((x,n)=>x.id=x.id||'sv'+n+Date.now());
 D.clients.forEach(c=>(c.items||[]).forEach(it=>(it.rates||[]).forEach(r=>{if(r.val!==undefined){if(it.t==='rec'){r.pct=r.val;r.cost=''}else{r.cost=r.val;r.pct=''}delete r.val}})));if(!D.cos){D.cos=[{id:'co1',...D.co,due:'30'},{id:'co2',name:'Get HR Mitra',addr:'',gstin:'',logo:'',bank:'',terms:'',due:'30'}];D.act='co1'}
 D.cos.forEach(c=>c.due=c.due||'30');D.cos.forEach(c=>{if(c.footer===undefined){c.footer=c.terms||'';c.terms=''}});D.cand=D.cand||[];D.hcs=D.hcs||{};D.hcadj=D.hcadj||[];if(D.pin&&!D.salt){D.pin='';D.rk=''}D.clients.forEach(c=>c.coid=c.coid||D.cos[0].id);D.invoices.forEach(i=>i.coid=i.coid||D.cos[0].id);if(!D.cos.some(c=>c.id===D.act))D.act=D.cos[0].id;D.co=D.cos.find(c=>c.id===D.act)}
mig();
const save=()=>{try{localStorage.setItem(K,ser())}catch(x){toast('Could not save: browser storage is full or blocked')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
const inr=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dm=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+(+n||0));return x.toISOString().slice(0,10)};
const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const INV=()=>D.invoices.filter(i=>i.coid===D.act),CL=()=>D.clients.filter(c=>c.coid===D.act);
const dueOf=i=>addDays(i.date,+i.terms||+D.co.due||30);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function st(i,k){k=k||calc(i);const rc=+i.rcv?.amt||0,td=+i.rcv?.tds||0,out=Math.max(0,Math.round((k.total-rc-td)*100)/100),t=today(),due=dueOf(i),p=out<0.5;
 return{out,due,paid:p,od:!p&&t>due?dd(due,t):0,age:p?(i.rcv?.date?dd(i.date,i.rcv.date):null):dd(i.date,t),label:p?'Received':t>due?'Overdue':rc+td>0?'Partial':'Pending'}}
const fyOf=d=>{const[y,m]=d.split('-').map(Number),s=m>=4?y:y-1;return s+'-'+String(s+1).slice(2)};
const nextNo=d=>{const fy=fyOf(d);const n=Math.max(0,...INV().filter(i=>i.fy===fy).map(i=>parseInt(i.no)||0))+1;return String(n).padStart(2,'0')+'/'+fy};
const O=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],T=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function w(n){if(n<20)return O[n];if(n<100)return T[n/10|0]+(n%10?' '+O[n%10]:'');if(n<1000)return O[n/100|0]+' Hundred'+(n%100?' '+w(n%100):'');
for(const[u,nm]of[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']])if(n>=u)return w(n/u|0)+' '+nm+(n%u?' '+w(n%u):'')}
const words=a=>{const r=Math.floor(a),p=Math.round((a-r)*100);return 'Rupees '+(r?w(r):'Zero')+(p?' and '+w(p)+' Paise':'')+' Only'};
function calc(v){const c=D.clients.find(x=>x.id===v.cid)||{};
 const lines=v.lines.map(l=>({...l,fee:l.t==='adj'?Math.round((+l.hc||0)*(+l.cost||0)*fr(l)*100)/100:l.t==='hc'?Math.round((+l.hc||0)*(+l.cost||0)*100)/100:(+l.amt>0?+l.amt:Math.round((+l.ctc||0)*(+l.pct||0)/100))}));
 const base=lines.reduce((a,l)=>a+l.fee,0),r=+v.gst||0,intra=!!c.gstin&&c.gstin.slice(0,2)===(D.co.gstin||'').slice(0,2);
 const gst=Math.round(base*r)/100;return{c,lines,base,r,intra,cgst:intra?gst/2:0,sgst:intra?gst/2:0,igst:intra?0:gst,gst,total:base+gst}}
let V='dash',E=null,C=null,F={y:'',m:'',s:'',c:'',df:'',dc:'',ds:'',hfy:'',hy:'',hmn:'',hall:''};let S=null,dirty=false,Q=null,HS=null,hdirty=false,DT='cand',A=null,IMP='',AT='cli',UNL=false;const leave=cb=>{if(!dirty&&!hdirty)return cb();ask('You have unsaved changes. Discard them?',cb,'Discard')};
const blank=()=>{const d=today();return{cid:CL()[0]?.id||'',date:d,bm:d.slice(0,7),no:nextNo(d),sv:CL()[0]?.sv||D.services[0]?.id||'',sac:(D.services.find(x=>x.id===CL()[0]?.sv)||D.services[0]||{}).sac||'',gst:CL()[0]?.gst||18,terms:CL()[0]?.terms||D.co.due||'30',lines:linesFor(CL()[0],d,d.slice(0,7)),rcv:{amt:'',tds:'',date:'',note:''}}};
const ln=c=>({t:'rec',cand:'',desig:'',doj:'',ctc:'',pct:c?.pct||'8.33',amt:'',desc:'',hc:'',cost:'',ref:'',frac:'1'});
const fr=l=>l.frac===''||l.frac==null?1:+l.frac;
const clientOf=id=>D.clients.find(x=>x.id===id);
const rateAt=(it,d,key)=>{const r=(it.rates||[]).filter(x=>x[key]!==''&&x[key]!=null&&(x.from||'')<=d).sort((a,b)=>(a.from||'').localeCompare(b.from||''));return r.length?r[r.length-1][key]:''};
const linesFor=(c,d,bm)=>c?.items?.length?c.items.map(it=>{const l={...ln(c),t:it.t==='rec'?'rec':'hc',desc:it.desc||'',hc:'',ci:it.id};if(l.t==='rec'){const r=rateAt(it,d,'pct');if(r!=='')l.pct=r}else{l.cost=rateAt(it,d,'cost');l.hc=hcAt(c.id,bm)}return l}):[ln(c)];
const reprice=()=>{const c=clientOf(E.cid);let ch=0;E.lines.forEach(l=>{if(!l.ci||l.m)return;const it=(c?.items||[]).find(x=>x.id===l.ci),k=l.t==='rec'?'pct':'cost',r=it?rateAt(it,E.date,k):'';if(r==='')return;if(String(l[k])!==String(r)){l[k]=r;ch=1}});return ch};
const adjd=l=>'Headcount adjustment against Invoice '+e(D.invoices.find(x=>x.id===l.ref)?.no||'(previous)')+': '+(+l.hc>0?'+':'')+e(l.hc||0)+' HC'+(fr(l)!==1?' for '+fr(l)+' of a period':'')+(l.desc?'<br>'+e(l.desc):'');
const prevInv=()=>D.invoices.filter(x=>x.cid===E.cid&&x.id!==E.id).sort((a,b)=>b.date.localeCompare(a.date));
const hcOf=i=>{const h=i.lines.filter(l=>l.t==='hc');return{n:h.reduce((a,l)=>a+(+l.hc||0),0),c:h[0]?.cost||''}};
const cnote=()=>{const c=clientOf(E.cid);return E.lines.filter(l=>l.ci).map(l=>{const it=(c?.items||[]).find(x=>x.id===l.ci);if(!it)return'';const m=[];if(it.start&&E.date<it.start)m.push('contract starts '+dm(it.start));if(it.end&&E.date>it.end)m.push('contract ended '+dm(it.end)+', confirm renewal and rate');return m.length?`<p style="color:var(--bad);margin:0 0 6px">${e(it.desc||'Line')}: ${m.join(', ')}</p>`:''}).join('')};
function adjf(l,i){const p=D.invoices.find(x=>x.id===l.ref),h=p?hcOf(p):null,k='E.lines.'+i+'.';return`<div class="f"><label>Previous invoice</label><select data-k="${k}ref"><option value="">Select invoice</option>${prevInv().map(x=>`<option value="${x.id}" ${x.id===l.ref?'selected':''}>${e(x.no)} (${dm(x.date)}) - ${hcOf(x).n} HC</option>`).join('')}</select></div>`+fld('HC change (+ add, - reduce)',k+'hc',l.hc,'number','step="any"')+fld('Cost per HC (Rs.)',k+'cost',l.cost,'number','step="any"')+fld('Period fraction (1 = full month)',k+'frac',l.frac,'number','step="any"')+fld('Note (optional)',k+'desc',l.desc)+(h?`<p style="grid-column:1/-1;margin:0;color:var(--mut)">Billed on ${e(p.no)}: ${h.n} HC${h.c?' @ '+inr(h.c):''}</p>`:'')}
const newItem=()=>({id:'k'+Date.now()+Math.random().toString(36).slice(2,5),t:'hc',desc:'HR shared services',start:'',end:'',rates:[{from:'',cost:'',pct:''}]});
function citems(){return`<h3>Contract line items (pre-filled on new invoices)</h3>`+(C.items||[]).map((it,n)=>{const k='C.items.'+n+'.';return`<div class="line"><div class="grid"><div class="f"><label>Billing type</label><select data-k="${k}t"><option value="hc" ${it.t==='hc'?'selected':''}>HR shared services (headcount)</option><option value="rec" ${it.t==='rec'?'selected':''}>Recruitment fee %</option></select></div>${fld('Description on invoice',k+'desc',it.desc,'text','placeholder="e.g. HR shared services, Recruitment charges"')}${fld('Contract start',k+'start',it.start,'date')}${fld('Contract end / renewal due',k+'end',it.end,'date')}</div><div style="margin-top:8px"><label style="font-size:12px;color:var(--mut)">Rates: Cost per HC (Rs.) and Fee %, each applies from its date. Headcount is entered manually on every invoice.</label>${it.rates.map((r,j)=>`<div class="row" style="margin:4px 0">${fld('From',k+'rates.'+j+'.from',r.from,'date')}${fld('Cost per HC (Rs.)',k+'rates.'+j+'.cost',r.cost,'number','step="any" placeholder="e.g. 25000"')}${fld('Fee % (recruitment)',k+'rates.'+j+'.pct',r.pct,'number','step="any" placeholder="e.g. 8.33"')}<button class="b del sm" data-a="rmrate" data-i="${n}" data-j="${j}">Remove</button></div>`).join('')}<button class="b g sm" data-a="addrate" data-i="${n}">Add renewal rate</button> <button class="b del sm" data-a="rmitem" data-i="${n}">Remove line</button></div></div>`}).join('')+`<button class="b g sm" data-a="additem">Add contract line</button>`}
const lab=l=>l.t==='adj'?'HC adjustment '+(+l.hc>0?'+':'')+(l.hc||0)+' vs '+(D.invoices.find(x=>x.id===l.ref)?.no||'prev'):l.t==='hc'?(l.desc||'HR shared services')+': '+(l.hc||0)+' HC x '+inr(l.cost):(l.cand||'Recruitment');
function sheet(v){const k=calc(v),sv=svOf(v),co=D.co;
 const tax=k.intra?`<tr><td>CGST @ ${k.r/2}%</td><td class="n">${inr(k.cgst)}</td></tr><tr><td>SGST @ ${k.r/2}%</td><td class="n">${inr(k.sgst)}</td></tr>`:`<tr><td>IGST @ ${k.r}%</td><td class="n">${inr(k.igst)}</td></tr>`;
 return`<div class="sheet"><div><div class="hd"><div>${co.logo?`<img src="${co.logo}" alt="">`:''}<h4>${e(co.name)}</h4><div style="white-space:pre-line">${e(co.addr)}</div><div>GSTIN: ${e(co.gstin)}</div><div>SAC Code: ${e(v.sac||sv.sac)} ${e(sv.name)}</div></div>
 <div style="text-align:right"><h4>TAX INVOICE</h4><div>Invoice No: <b>${e(v.no)}</b></div><div>Invoice Date: <b>${dm(v.date)}</b></div><div>Due Date: <b>${dm(addDays(v.date,+v.terms||+D.co.due||30))}</b></div></div></div>
 <div><b>To,</b><br><b>${e(k.c.name)}</b><br><span style="white-space:pre-line">${e(k.c.addr)}</span><br>GSTIN: ${e(k.c.gstin)}${k.c.po?'<br>PO / Work order: '+e(k.c.po):''}</div>
 <table><tr><th style="width:40px">S.No.</th><th>Particular</th><th>Qty</th><th class="n">Rate (Rs.)</th><th class="n">Amount (Rs.)</th></tr>
 ${k.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${l.t==='adj'?adjd(l):l.t==='hc'?e(l.desc||'HR shared services')+(v.bm?'<br>For the month of '+MN[+v.bm.slice(5)-1]+' '+v.bm.slice(0,4):''):e(l.desc||'Recruitment Charges')+(+l.ctc&&!(+l.amt)?' @ '+e(l.pct)+'%':'')+(l.cand&&!l.desc?' for the candidate':'')}${l.t==='hc'||l.t==='adj'?'':(l.cand?'<br>Name: '+e(l.cand):'')+(l.desig?'<br>Desig.: '+e(l.desig):'')+(+l.ctc?'<br>CTC: '+inr(l.ctc):'')+(l.doj?'<br>DOJ: '+dm(l.doj):'')}</td><td>${l.t==='hc'||l.t==='adj'?e(l.hc):1}</td><td class="n">${inr(l.t==='hc'?l.cost:l.t==='adj'?l.cost*fr(l):l.fee)}</td><td class="n">${inr(l.fee)}</td></tr>`).join('')}</table>

async function dl(n,c,m){
 if(window.claude){let d=null;try{d=await window.claude.use('downloads')}catch(x){}
  if(d){try{await d.save({filename:n,data:c});toast('File ready: '+n)}catch(x){if(x&&x.code!=='declined')showText(n,c)}return}
  return showText(n,c)}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m||'text/plain'}));a.download=n;a.click()}

function showText(n,c){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px';
 o.innerHTML=`<div class="card" style="max-width:720px;width:100%;margin:0"><h3 style="margin-top:0">${e(n)}</h3><p style="color:var(--mut)">Downloads are not available here. Copy this text and save it as <b>${e(n)}</b> (paste into Notepad or Excel).</p><textarea readonly style="min-height:200px;font-family:monospace"></textarea><div class="row" style="margin:12px 0 0"><button class="b acc" id="cpy">Copy</button><button class="b g" id="cls">Close</button></div></div>`;
 document.body.appendChild(o);const t=o.querySelector('textarea');t.value=c;t.select();
 o.querySelector('#cls').onclick=()=>o.remove();o.querySelector('#cpy').onclick=()=>{t.select();try{navigator.clipboard.writeText(c).then(()=>toast('Copied'),()=>document.execCommand('copy'))}catch(x){document.execCommand('copy')}}}
